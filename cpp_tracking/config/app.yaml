model_path: ../models/best.onnx
video_path: ../video/longchau.mp4
output_path: ../video/longchau_cpp_output.mp4
baseline_output_path: ../video/longchau_cpp_baseline.json

det_conf: 0.5
det_iou: 0.50
input_width: 640
input_height: 640

show_window: true
window_name: YOLO ONNX + Tracker (C++)
