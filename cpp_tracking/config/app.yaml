track_buffer: 900
match_thresh: 0.92
proximity_thresh: 0.85
appearance_thresh: 0.45
second_association_thresh: 0.72
unconfirmed_association_thresh: 0.82
reid_recovery_enabled: true
reid_recovery_proximity_thresh: 0.93
reid_recovery_appearance_thresh: 0.65
reid_recovery_thresh: 0.75
reid_model_path: ../models/osnet_x0_5_msmt17.onnx
cmc_interval: 2
cmc_max_side: 960
reid_max_detections: 96
frame_rate: 30
